<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>hapi skill: learn football like a game</title>
    <meta name="description" content="32 football skills, each with a drill, a test and a tip. Pass the test, unlock the next one." />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f2f2f2" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="privacy-policy" href="/privacy.html" />
    <meta name="apple-mobile-web-app-title" content="hapi skill" />

    <!-- Link previews (WhatsApp, iMessage, Instagram, X). Crawlers need full URLs, so update these if the domain changes. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="hapi skill" />
    <meta property="og:title" content="hapi skill: learn football like a game" />
    <meta property="og:description" content="32 football skills, each with a drill, a test and a tip. Pass the test, unlock the next one." />
    <meta property="og:url" content="https://skill-tree-5y8k.vercel.app/" />
    <meta property="og:image" content="https://skill-tree-5y8k.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="hapi skill: a football skill tree with finished skills lit up." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Splash: shown by the browser as soon as the page loads, replaced when React renders. -->
    <style>
      .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 1.5rem; text-align: center; background: #0a0a0a; color: #f2f2f2; font-family: -apple-system, BlinkMacSystemFont, "Inter", system-ui, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .splash-brand { font-size: 2rem; font-weight: 700; line-height: 1.2; letter-spacing: -0.03em; }
      .splash-note, .splash-retry { margin: 0; font-size: 0.95rem; font-weight: 500; line-height: 1.4; }
      .splash-retry { font-family: inherit; padding: 0.5rem 1rem; border: 1px solid currentColor; border-radius: 999px; background: none; color: inherit; cursor: pointer; }
      @media (prefers-color-scheme: light) { .splash { background: #f2f2f2; color: #0a0a0a; } }
      @media (prefers-reduced-motion: no-preference) { .splash-brand { animation: splash-pulse 1.2s ease-in-out infinite; } }
      @keyframes splash-pulse { 50% { opacity: 0.45; } }
    </style>
  </head>
  <body>
    <div id="root"><div class="splash" role="status" aria-label="hapi skill">
      <span class="splash-brand" aria-hidden="true">hapi skill</span>
      <noscript><p class="splash-note">hapi skill needs JavaScript. Turn it on and reload the page.</p></noscript>
      <button type="button" id="splash-retry" class="splash-retry" hidden>Couldn't load. Tap to retry.</button>
    </div></div>
    <script>
      // React replaces the splash when it mounts. If the splash is still here after 8 seconds, the app bundle most likely failed to load.
      setTimeout(function () {
        var retry = document.getElementById('splash-retry');
        if (!retry) return;
        retry.hidden = false;
        retry.addEventListener('click', function () { location.reload(); });
      }, 8000);
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
