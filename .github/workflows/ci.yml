name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Vercel's GitHub link stopped starting builds for main (#63), so CI asks Vercel to deploy instead,
  # and only after lint, tests and build pass. VERCEL_DEPLOY_HOOK is a deploy hook URL from Vercel
  # (Project Settings > Git > Deploy Hooks, branch main), saved as a repository secret.
  # A deploy hook always starts a new build. If Vercel's own Git trigger works again, each push to
  # main builds twice; then remove this job or the hook.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ask Vercel to deploy main
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::VERCEL_DEPLOY_HOOK isn't set, so main was not deployed. See #63."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$HOOK" > /dev/null
          echo "Asked Vercel to deploy main."
