name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Vercel's GitHub link stopped starting builds for main (#63), so CI deploys instead, and only after
  # lint, tests and build pass. It checks out GITHUB_SHA and uploads exactly that commit with the
  # Vercel CLI. Needs repository secrets VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID
  # (Vercel > Project Settings > General, and Account Settings > Tokens). Missing secrets fail the job.
  # If Vercel's own Git trigger works again, each push to main builds twice; then remove this job.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # One deploy at a time, so an older commit can't finish after a newer one and replace it.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_CLI: vercel@66.6.0
    steps:
      - name: Check Vercel secrets
        id: config
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::VERCEL_TOKEN, VERCEL_ORG_ID or VERCEL_PROJECT_ID isn't set, so $GITHUB_SHA was not deployed. See #63."
            exit 1
          fi
      - name: Skip if main has moved on
        id: latest
        shell: bash
        run: |
          set -o pipefail
          head=$(git ls-remote "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" refs/heads/main | cut -f1)
          [ -n "$head" ] || { echo "::error::Could not read main from $GITHUB_REPOSITORY."; exit 1; }
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::main is now at $head, a newer commit. Skipping $GITHUB_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          else
            echo "current=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.latest.outputs.current == 'true'
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        if: steps.latest.outputs.current == 'true'
        with:
          node-version: 22
      - name: Deploy ${{ github.sha }} to Vercel production
        if: steps.latest.outputs.current == 'true'
        run: |
          npx --yes "$VERCEL_CLI" pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" build --prod --token="$VERCEL_TOKEN"
          npx --yes "$VERCEL_CLI" deploy --prebuilt --prod --token="$VERCEL_TOKEN" \
            --meta githubCommitSha="$GITHUB_SHA" --meta githubCommitRef=main
          echo "Deployed $GITHUB_SHA."
